[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire-sec"
version = "0.1.0"
description = "Tripwire: Differential Dynamic Behavioral Analysis (DDBA) for Software Supply Chains"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Tripwire Core Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "docker>=7.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.4.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.scripts]
tripwire = "tripwire.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
